<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solana Radar</title>
<style>body{font-family:system-ui;margin:0;background:#0b0d12;color:#eef2f7}header{padding:18px;position:sticky;top:0;background:#0b0d12;border-bottom:1px solid #222}.wrap{max-width:1100px;margin:auto;padding:0 14px}button{padding:9px 14px;border:0;border-radius:9px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #20242d;font-size:13px}th{color:#9ba5b5}.pill{padding:3px 7px;border-radius:7px;background:#202633}.muted{color:#9ba5b5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.card{background:#12161e;padding:12px;border-radius:12px}.score{font-weight:700;font-size:18px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}th:nth-child(n+6),td:nth-child(n+6){display:none}}
</style></head><body><header><div class="wrap"><strong>🛰️ Solana Radar V1</strong> <button id="refresh">Refresh</button><span id="status" class="muted"></span></div></header><main class="wrap"><div class="grid"><div class="card">Tokens<br><span id="tokens" class="score">—</span></div><div class="card">Observations<br><span id="obs" class="score">—</span></div><div class="card">Signals<br><span id="signals" class="score">—</span></div></div><table><thead><tr><th>Token</th><th>Opportunity</th><th>Risk</th><th>1h</th><th>24h</th><th>Liquidity</th><th>Volume</th><th>Why</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
function cell(text){const td=document.createElement('td');td.textContent=text;return td}
async function load(){const [r,s]=await Promise.all([fetch('/api/radar?limit=50'),fetch('/api/status')]);const data=await r.json(),st=await s.json();document.getElementById('tokens').textContent=st.tokens;document.getElementById('obs').textContent=st.observations;document.getElementById('signals').textContent=st.signals;const tbody=document.getElementById('rows');tbody.replaceChildren();for(const x of data){const tr=document.createElement('tr');tr.append(cell(`${x.symbol||'?'} — ${x.name||''}`));tr.append(cell(fmt(x.opportunity_score)));tr.append(cell(fmt(x.risk_score)));tr.append(cell(`${fmt(x.price_change_1h)}%`));tr.append(cell(`${fmt(x.price_change_24h)}%`));tr.append(cell(`$${fmt(x.liquidity)}`));tr.append(cell(`$${fmt(x.volume_24h)}`));tr.append(cell(x.explanation||''));tbody.append(tr)}}
document.getElementById('refresh').onclick=async()=>{const b=document.getElementById('refresh');b.disabled=true;b.textContent='Refreshing…';try{const r=await fetch('/api/refresh',{method:'POST'});document.getElementById('status').textContent=r.ok?' Updated':' Failed';await load()}finally{b.disabled=false;b.textContent='Refresh'}};load();setInterval(load,30000);
</script></body></html>
